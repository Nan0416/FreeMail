name: Publish client

# Stages @freemail/client on npm when a `client-v<version>` tag is pushed. npm holds the staged version until a
# maintainer approves it with 2FA. One-time setup and the release steps are in docs/RELEASING.md.
on:
  push:
    tags: ['client-v*']

permissions:
  contents: read

concurrency:
  group: publish-client
  cancel-in-progress: false

jobs:
  # Everything that runs the repo's code (install scripts, lint, build, tests) happens here, without the OIDC token.
  build:
    runs-on: ubuntu-26.04
    outputs:
      dist-tag: ${{ steps.check.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tag check below needs origin/main
      # No npm cache in a release build: it is shared with ordinary branch runs.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check the tag matches the package version and is on main
        id: check
        run: |
          package_version="$(node -p "require('./packages/client/package.json').version")"
          if [ "${GITHUB_REF_NAME#client-v}" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/client/package.json version $package_version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main."
            exit 1
          fi
          # npm requires a dist-tag other than `latest` for a prerelease.
          case "$package_version" in
            *-*) echo "dist-tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist-tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -w @freemail/client
      - name: Pack
        working-directory: packages/client
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Only this job can get the OIDC token npm trusts, and it runs nothing from the repo: it stages the tarball built above.
  publish:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write # npm trusted publishing: npm exchanges the job's OIDC token, so no npm token is stored
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: package
      # Trusted publishing needs npm 11.5.1+, and staged publishing 11.15.0+; Node 22 comes with npm 10.
      - run: npm install -g npm@12.2.3
      - name: Stage the release on npm
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: npm stage publish ./package/*.tgz --tag "$DIST_TAG"
